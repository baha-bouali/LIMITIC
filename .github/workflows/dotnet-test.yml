name: .NET Unit Tests

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore LIMTIC.Service/LIMTIC.WebAPI/LIMTIC.WebAPI.sln

      - name: Build
        run: dotnet build --no-restore --configuration Release LIMTIC.Service/LIMTIC.WebAPI/LIMTIC.WebAPI.sln

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal ../LIMTIC.UnitTests/LIMTIC.UnitTests.csproj
